name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 安装 Python 3.11
        run: uv python install 3.11

      - name: 安装依赖
        run: uv sync --frozen --all-extras --dev

      - name: ruff 静态检查
        run: uv run ruff check src tests eval scripts

      - name: ruff 格式检查
        run: uv run ruff format --check src tests eval scripts

      - name: mypy strict 类型检查
        run: uv run mypy src

      - name: pytest（全离线）
        run: uv run pytest

      - name: 评测（8 项指标，未实现项标pending）
        run: uv run python eval/runner.py

      # 硬门禁 1：README/docs 里引用的文件必须真实存在
      # 防止出现「承诺了文档但文件不存在」—— 面试官点开 README 3 秒就能发现
      - name: 文档链接校验
        run: uv run python scripts/check_doc_links.py

      # 硬门禁 2：排障 SOP 与 errors.py 必须零漂移
      # 防止加了错误码忘记更文档，导致客户按手册操作解决不了问题
      - name: 文档与代码漂移校验
        run: uv run python scripts/gen_troubleshooting.py --check

      # 硬门禁 3：README 首屏徽章数字与实算零漂移
      # 防止加测试/改 eval 后忘记重跑 make badges，首屏展示过期数字
      - name: 徽章与实算漂移校验
        run: uv run python scripts/gen_badges.py --check

      - name: CLI 入口自检（装包后不能 ImportError）
        run: uv run basepilot-mcp doctor

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 安装 Python 3.11
        run: uv python install 3.11

      - name: 安装依赖
        run: uv sync --all-extras --dev

      - name: 构建镜像
        run: docker build -t basepilot:ci .

      - name: 镜像能启动且 --help 正常
        run: |
          docker run --rm basepilot:ci --help || \
          docker run --rm basepilot:ci python -c "import basepilot; print(basepilot.__version__)"