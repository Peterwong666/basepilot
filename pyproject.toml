[project]
name = "basepilot"
version = "0.1.0"
description = "面向企业交付的飞书多维表格 MCP Server —— 让 Claude Code / Cursor 安全读写业务台账"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Peter Wong" }]
keywords = ["mcp", "feishu", "lark", "bitable", "fde", "rag", "agent"]

dependencies = [
    "httpx>=0.27",
    "fastmcp>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
basepilot-mcp = "basepilot.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.22",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RET", "ARG"]
ignore = [
    "S101",  # assert 用于测试断言
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# S104: 测试里断言 0.0.0.0 绑定参数透传，非真实监听
"tests/**" = ["S104", "S105", "S106", "ARG001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*", "basepilot.scenarios_loader"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["basepilot.scenarios_loader"]
warn_unreachable = false
